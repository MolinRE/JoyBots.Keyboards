name: NuGet Publish

on:
  push:
    branches:
      - main

jobs:
  nuget-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v1
        with:
          source-url: https://api.nuget.org/v3/index.json
          dotnet-version: 8.0.x
        env:
          NUGET_AUTH_TOKEN: ${{secrets.NUGET_TOKEN}}
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build src/JoyBots.Keyboards/JoyBots.Keyboards.csproj -c Release --no-restore
      - name: Publish JoyBots.Keyboards
        run: |
          mkdir out
          dotnet pack src/JoyBots.Keyboards/JoyBots.Keyboards.csproj -c Release -o out --no-restore
          dotnet nuget push "./out/*.nupkg" --skip-duplicate --no-symbols --api-key ${{secrets.NUGET_TOKEN}}
          rm -rf out